<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Connexion indisponible</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --text: #12263d;
      --muted: #5b7388;
      --border: #dfe7f1;
      --navy: #0f3352;
      --gold: #d9a536;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: min(100%, 420px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 16px 40px rgba(15, 51, 82, 0.08);
      padding: 28px 22px 22px;
      text-align: center;
    }
    .icon {
      width: 78px;
      height: 78px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: rgba(15, 51, 82, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      color: var(--navy);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 26px;
      line-height: 1.2;
      letter-spacing: -0.03em;
      color: var(--navy);
    }
    p {
      margin: 0;
      font-size: 15px;
      line-height: 1.6;
      color: var(--muted);
    }
    .loader {
      margin: 22px auto 0;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 4px solid rgba(15, 51, 82, 0.12);
      border-top-color: var(--gold);
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" aria-hidden="true">📶</div>
    <h1>Connexion perdue</h1>
    <p>Vérifiez votre connexion Internet. L’application reprendra automatiquement dès qu’elle est restaurée.</p>
    <div class="loader" aria-label="Chargement de la connexion"></div>
  </div>
</body>
</html>
