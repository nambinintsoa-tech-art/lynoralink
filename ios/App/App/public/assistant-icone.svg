<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      .navy { fill: #0A2647; }
      .gold { fill: #D4AF37; }
      .white { fill: #FFFFFF; }
    </style>
  </defs>

  <g transform="translate(10,4)">
    <!-- Antenne -->
    <circle cx="90" cy="18" r="10" class="gold"/>
    <rect x="84" y="28" width="12" height="20" rx="6" class="gold"/>

    <!-- Tête du robot -->
    <rect x="0" y="48" width="180" height="144" rx="28" class="navy"/>

    <!-- Écran / visage -->
    <rect x="22" y="70" width="136" height="100" rx="18" fill="#0A2647" stroke="#D4AF37" stroke-width="3"/>

    <!-- Yeux -->
    <circle cx="62" cy="118" r="14" class="white"/>
    <circle cx="118" cy="118" r="14" class="white"/>
    <circle cx="62" cy="118" r="5" class="gold"/>
    <circle cx="118" cy="118" r="5" class="gold"/>

    <!-- Sourire -->
    <path d="M60 148 Q90 168 120 148" stroke="#D4AF37" stroke-width="8" stroke-linecap="round" fill="none"/>

    <!-- Oreilles -->
    <rect x="-18" y="92" width="18" height="48" rx="9" class="gold"/>
    <rect x="180" y="92" width="18" height="48" rx="9" class="gold"/>
  </g>
</svg>
